<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <span class="brand">Admin area</span>
</div>

<div class="card wide">
    <h2>Admin area</h2>
    <div class="alert success">Reserved to <code>ROLE_ADMIN</code>. Content read from the database.</div>

    <table>
        <thead>
        <tr><th>Id</th><th>Username</th><th>Active</th><th>Password hash (BCrypt)</th><th>Roles</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.active}"></td>
            <td><code th:text="${#strings.abbreviate(u.password, 32)}"></code></td>
            <td><span th:each="r : ${u.roles}" th:text="${r.name}" style="margin-right:8px"></span></td>
        </tr>
        </tbody>
    </table>

    <div class="links"><a th:href="@{/home}">Back to home</a></div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="danger">Sign out</button>
    </form>
</div>
</body>
</html>
